name: Build & Validate scanner.exe

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      # ── 3. Install build dependencies ────────────────────────────────────────
      - name: Install PyInstaller
        run: pip install "pyinstaller==6.11.1"

      # ── 4. Ensure collectors package is importable ────────────────────────────
      - name: Create collectors/__init__.py
        shell: pwsh
        run: |
          if (-not (Test-Path "collectors\__init__.py")) {
            New-Item -Path "collectors\__init__.py" -ItemType File -Force | Out-Null
            Write-Host "Created collectors/__init__.py"
          }

      # ── 5. Build ──────────────────────────────────────────────────────────────
      - name: Build scanner.exe
        run: pyinstaller scanner.spec --noconfirm --clean

      - name: Verify exe exists and report size
        shell: pwsh
        run: |
          $exe = "dist\scanner.exe"
          if (!(Test-Path $exe)) {
            Write-Error "scanner.exe not found after build"
            exit 1
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "scanner.exe built successfully — $mb MB"

      # ── 6. Run ────────────────────────────────────────────────────────────────
      - name: Run scanner.exe
        working-directory: dist
        shell: pwsh
        run: |
          .\scanner.exe --output scan_report.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "scanner.exe exited with code $LASTEXITCODE"
            exit 1
          }

      # ── 7. Validate JSON structure ────────────────────────────────────────────
      - name: Validate JSON output
        working-directory: dist
        shell: python
        run: |
          import json, sys, os

          path = "scan_report.json"
          if not os.path.exists(path):
              print("FAIL: scan_report.json not found")
              sys.exit(1)

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          errors = []

          # ── Top-level keys ───────────────────────────────────────────────────
          required = [
              "system_info", "software", "processes", "disk_health",
              "startup", "security", "network",
              "onedrive", "junk", "user_folders", "folders", "large_files", "_meta",
          ]
          for key in required:
              if key not in data:
                  errors.append(f"Missing top-level key: '{key}'")

          # ── system_info ──────────────────────────────────────────────────────
          si = data.get("system_info", {})
          for field in ["hostname", "os", "cpu", "memory", "disks", "uptime_seconds"]:
              if field not in si:
                  errors.append(f"system_info missing: '{field}'")
          if not si.get("hostname"):
              errors.append("system_info.hostname is empty")
          mem = si.get("memory", {})
          if mem.get("total_bytes", 0) == 0:
              errors.append("system_info.memory.total_bytes is 0")
          if not isinstance(si.get("disks"), list) or not si.get("disks"):
              errors.append("system_info.disks is empty")

          # ── software ─────────────────────────────────────────────────────────
          sw = data.get("software", [])
          if not isinstance(sw, list) or len(sw) == 0:
              errors.append("software list is empty — registry read likely failed")
          else:
              for field in ["name", "version", "publisher"]:
                  if field not in sw[0]:
                      errors.append(f"software[0] missing: '{field}'")
              print(f"OK  software      : {len(sw)} entries")

          # ── processes ─────────────────────────────────────────────────────────
          procs = data.get("processes", {})
          if not isinstance(procs, dict):
              errors.append("processes is not a dict")
          else:
              top = procs.get("top_by_memory", [])
              if not isinstance(top, list) or len(top) == 0:
                  errors.append("processes.top_by_memory is empty — process snapshot failed")
              else:
                  worst = top[0]
                  mb = round(worst.get("memory_bytes", 0) / 1048576)
                  print(f"OK  processes     : {len(top)} entries, top={worst.get('name')} ({mb} MB)")

          # ── disk_health ───────────────────────────────────────────────────────
          dh = data.get("disk_health", {})
          if not isinstance(dh, dict):
              errors.append("disk_health is not a dict")
          else:
              pd = dh.get("physical_disks", [])
              if not isinstance(pd, list) or len(pd) == 0:
                  errors.append("disk_health.physical_disks is empty — WMI query failed")
              else:
                  models = ", ".join(d.get("model", "?") for d in pd)
                  print(f"OK  disk_health   : {len(pd)} disk(s) [{models}], "
                        f"failure_predicted={dh.get('any_failure_predicted')}")

          # ── startup ───────────────────────────────────────────────────────────
          st_list = data.get("startup", [])
          if not isinstance(st_list, list):
              errors.append("startup is not a list")
          else:
              print(f"OK  startup       : {len(st_list)} entries")

          # ── security ─────────────────────────────────────────────────────────
          sec = data.get("security", {})
          if not isinstance(sec, dict):
              errors.append("security is not a dict")
          else:
              for field in ["antivirus_products", "pending_reboot", "firewall"]:
                  if field not in sec:
                      errors.append(f"security missing: '{field}'")
              print(f"OK  security      : AV products={len(sec.get('antivirus_products', []))}, "
                    f"reboot_pending={sec.get('pending_reboot')}")

          # ── network ───────────────────────────────────────────────────────────
          net = data.get("network", {})
          if not isinstance(net, dict):
              errors.append("network is not a dict")
          else:
              print(f"OK  network       : {len(net.get('adapters', []))} adapter(s), "
                    f"user={net.get('logged_in_user', 'n/a')}")

          # ── onedrive ─────────────────────────────────────────────────────────
          od = data.get("onedrive", {})
          if not isinstance(od, dict):
              errors.append("onedrive is not a dict")
          else:
              print(f"OK  onedrive      : installed={od.get('client_installed')}, "
                    f"teams={od.get('teams_installed')}")

          # ── junk ─────────────────────────────────────────────────────────────
          junk = data.get("junk", {})
          if not isinstance(junk, dict):
              errors.append("junk is not a dict")
          else:
              safe_gb = round(junk.get("safe_to_delete_bytes", 0) / (1024**3), 2)
              print(f"OK  junk          : {safe_gb} GB safely removable")

          # ── user_folders ──────────────────────────────────────────────────────
          uf = data.get("user_folders", {})
          if not isinstance(uf, dict):
              errors.append("user_folders is not a dict")
          else:
              print(f"OK  user_folders  : {list(uf.keys())}")

          # ── folders / large_files ─────────────────────────────────────────────
          folds = data.get("folders", [])
          if not isinstance(folds, list) or len(folds) == 0:
              errors.append("folders list is empty")
          else:
              print(f"OK  folders       : {len(folds)} entries")

          lf = data.get("large_files", [])
          if not isinstance(lf, list):
              errors.append("large_files is not a list")
          else:
              print(f"OK  large_files   : {len(lf)} file(s) >= 100 MB")

          # ── _meta ─────────────────────────────────────────────────────────────
          meta = data.get("_meta", {})
          if meta.get("total_elapsed_seconds", 0) <= 0:
              errors.append("_meta.total_elapsed_seconds is 0 or missing")

          # ── Summary ───────────────────────────────────────────────────────────
          print("\n-- Validation summary ----------------------------------")
          if errors:
              for e in errors:
                  print(f"  FAIL: {e}")
              print(f"\n{len(errors)} error(s) found.")
              sys.exit(1)
          else:
              kb = round(os.path.getsize(path) / 1024, 1)
              print(f"  All checks passed.")
              print(f"  Report size  : {kb} KB")
              print(f"  Hostname     : {si.get('hostname')}")
              os_info = si.get('os', {})
              print(f"  OS           : Windows {os_info.get('release')} {os_info.get('version','')[:20]}")
              print(f"  RAM          : {round(mem.get('total_bytes',0)/1073741824,1)} GB "
                    f"({mem.get('load_percent')}% used)")
              print(f"  Elapsed      : {meta.get('total_elapsed_seconds')}s")

      # ── 8. Upload exe artifact ────────────────────────────────────────────────
      - name: Upload scanner.exe
        uses: actions/upload-artifact@v4
        with:
          name: scanner-exe
          path: dist/scanner.exe
          retention-days: 30

      # ── 9. Upload sample report for inspection ────────────────────────────────
      - name: Upload scan_report.json (CI runner sample)
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-ci
          path: dist/scan_report.json
          retention-days: 7
