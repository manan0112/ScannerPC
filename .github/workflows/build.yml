name: Build scanner.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # also allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Create collectors/__init__.py
        run: echo $null > collectors/__init__.py

      - name: Build exe
        run: pyinstaller scanner.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner-exe
          path: dist/scanner.exe
          retention-days: 30